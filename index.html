<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PS4 · Catálogo de juegos</title><link rel="stylesheet" href="catalogo.css"><script src="catalogo.js" defer></script></head>
<body><main>
<header><p class="eyebrow">PS4 DATA GAMES</p><h1>Tu catálogo de juegos</h1><p>Busca un título y consulta sus enlaces externos disponibles.</p></header>
<section class="controls" aria-label="Filtros"><label for="search">Buscar por nombre</label><input id="search" type="search" placeholder="God of War, Spider-Man…" disabled><label class="checkbox"><input id="include-empty" type="checkbox" disabled> Incluir títulos sin enlaces</label></section>
<p id="status" role="status" aria-live="polite">Cargando catálogo…</p>
<div id="error" role="alert" hidden><p id="error-message"></p><button id="retry" type="button">Volver a intentar</button></div>
<section id="games" aria-label="Juegos"></section>
<nav id="pagination" aria-label="Páginas" hidden><button id="previous" type="button">Anterior</button><span id="page-info"></span><button id="next" type="button">Siguiente</button></nav>
<footer>Este catálogo no aloja archivos. Los enlaces abren sitios externos; su disponibilidad depende de cada proveedor.</footer>
</main></body></html>
